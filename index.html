  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel La Casa Cielo - Fidjrossè, Cotonou</title>
    <meta name="description" content="Hôtel de luxe à Fidjrossè, Cotonou. Chambres climatisées, piscine, restaurant et salles de conférence. Réservez votre séjour au bord de l'Atlantique." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hotel La Casa Cielo" />
    <meta property="og:title" content="Hotel La Casa Cielo - Fidjrossè, Cotonou" />

    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / WhatsApp fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hotel La Casa Cielo - Fidjrossè, Cotonou" />
    <meta name="twitter:description" content="Hôtel de luxe à Fidjrossè, Cotonou. Chambres climatisées, piscine, restaurant et salles de conférence." />
    <meta name="twitter:image" content="https://casacielohotel-demo.netlify.app/assets/imgs/display.jpg" />

    <!-- JSON-LD: Hotel structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Hotel", "LodgingBusiness"],
      "name": "Hotel La Casa Cielo",
      "description": "Hôtel de luxe à Fidjrossè, Cotonou. Chambres climatisées, piscine, restaurant et salles de conférence au bord de l'Atlantique.",
      "url": "https://casacielohotel-demo.netlify.app/",
      "telephone": "+22967867272",
      "email": "reservations@casacielohotel.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Fin Pavé Fidjrossè Plage, Rue de l'Église Morija",
        "addressLocality": "Cotonou",
        "addressRegion": "Littoral",
        "addressCountry": "BJ"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 6.353,
        "longitude": 2.385
      },
      "image": [
        "https://casacielohotel-demo.netlify.app/assets/imgs/display.jpg",
        "https://casacielohotel-demo.netlify.app/assets/imgs/1631256984RESTAURANT-A.png",
        "https://casacielohotel-demo.netlify.app/assets/imgs/1631267209RESTAURANT-C.png"
      ],
      "priceRange": "$$",
      "currenciesAccepted": "XOF",
      "paymentAccepted": "Cash, Credit Card",
      "checkInTime": "14:00",
      "checkOutTime": "12:00",
      "numberOfRooms": 36,
      "amenityFeature": [
        {"@type": "LocationFeatureSpecification", "name": "Piscine extérieure", "value": true},
        {"@type": "LocationFeatureSpecification", "name": "Restaurant", "value": true},
        {"@type": "LocationFeatureSpecification", "name": "Wi-Fi gratuit", "value": true},
        {"@type": "LocationFeatureSpecification", "name": "Climatisation", "value": true},
        {"@type": "LocationFeatureSpecification", "name": "Salles de conférence", "value": true},
        {"@type": "LocationFeatureSpecification", "name": "Service 24h/24", "value": true},
        {"@type": "LocationFeatureSpecification", "name": "Navette aéroport", "value": true}
      ],
      "starRating": {"@type": "Rating", "ratingValue": "4"},
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "8.6",
        "bestRating": "10",
        "worstRating": "1",
        "reviewCount": "50"
      }
    }
    </script>

    <!-- Preload above-the-fold images so the browser fetches them immediately -->
    <link rel="preload" as="image" href="/assets/imgs/logo.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/imgs/display.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
